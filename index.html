<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(135deg,#ff4e8a,#ffb6c1,#ffd700);
  overflow:hidden;
  font-family:sans-serif;
}
.card{
  background:rgba(255,255,255,0.15);
  padding:30px;
  border-radius:25px;
  backdrop-filter:blur(10px);
  color:white;
  box-shadow:0 0 25px rgba(0,0,0,0.3);
}
h1{
  font-size:2.5em;
  animation:pop 1s infinite alternate;
}
p{
  font-size:1.2em;
}
@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.08);}
}
.heart{
  position:absolute;
  color:white;
  font-size:24px;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(100vh) scale(0.5);opacity:1;}
  to{transform:translateY(-10vh) scale(1.5);opacity:0;}
}
.firework{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  animation:explode 1s ease-out infinite;
}
@keyframes explode{
  from{transform:scale(0);opacity:1;}
  to{transform:scale(12);opacity:0;}
}
button{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff2e74;
  font-size:1em;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
  <h1>🎂 Happy Birthday TITHI 🎉</h1>
  <p>আজকের দিনটা শুধু তোমার জন্য ✨</p>
  <p>তুমি সবসময় হাসিখুশি থাকো, সুস্থ থাকো, আর আমার জীবনে এমনই বিশেষ হয়ে থেকো 💖</p>
  <p><b>— তোমার SAYAN ❤️</b></p>
  <button onclick="alert('I Love You ❤️')">Click Me 💌</button>
</div>

<script>
// floating hearts
for(let i=0;i<30;i++){
  let h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤';
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(4+Math.random()*4)+'s';
  h.style.fontSize=(20+Math.random()*30)+'px';
  document.body.appendChild(h);
}

// fireworks
function createFirework(){
  let f=document.createElement('div');
  f.className='firework';
  f.style.left=Math.random()*100+'vw';
  f.style.top=Math.random()*100+'vh';
  f.style.background='hsl('+Math.random()*360+',100%,60%)';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1000);
}
setInterval(createFirework,300);
</script>

</body>
</html>SAYAN
